# gromore_flutter_plugin —— 按需 ADN 开关（Req 11.4 / 11.5）
#
# 这些属性控制 GroMore 各 ADN（广告网络）的 SDK 与适配器 .aar 是否被纳入构建产物。
# 默认全部启用（true）。集成方若只需要部分 ADN，可在 **自身 app 工程的
# android/gradle.properties**（或通过命令行 -P 参数）覆盖对应开关为 false，
# 被禁用的 ADN 不会打入构建产物，其余已启用 ADN 不受影响。
#
# 可用开关与默认值：
#   gromore.enableBaidu=true     # 百度 ADN（Baidu_MobAds_SDK + mediation_baidu_adapter）
#   gromore.enableGdt=true       # 优量汇 GDT ADN（GDTSDK.unionNormal + mediation_gdt_adapter）
#   gromore.enableKs=true        # 快手 ADN（kssdk-ad + mediation_ks_adapter）
#   gromore.enableSigmob=true    # Sigmob ADN（windAd + windAd-common + mediation_sigmob_adapter）
#
# 示例（仅启用穿山甲核心 + 百度，禁用其余）：
#   gromore.enableGdt=false
#   gromore.enableKs=false
#   gromore.enableSigmob=false

gromore.enableBaidu=true
gromore.enableGdt=true
gromore.enableKs=true
gromore.enableSigmob=true
